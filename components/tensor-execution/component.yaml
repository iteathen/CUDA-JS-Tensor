{
  "schema_version": 1,
  "component": {
    "id": "tensor.execution.simt",
    "name": "Resolved tensor plan and generated SIMT execution",
    "status": "public-alpha",
    "product_area": "components",
    "path": "components/tensor-execution",
    "purpose": "Bind immutable tensor plans to one session and a complete deterministic Device-JS SIMT realization with finite prepared execution and explicit result cleanup.",
    "public_contracts": ["index.mjs", "index.d.ts"],
    "allowed_dependencies": ["node-standard-library", "tensor.value", "tensor.program-plan", "public-cuda-js-0.1.0-alpha.14"],
    "forbidden_dependencies": ["cuda-js-internals", "native-cuda", "embedded-cuda-source", "consumer-policy", "neural-policy", "mcgs-policy", "the_restaurant"],
    "validation": ["npm run test:tensor-execution", "npm run test:package", "npm run smoke:native:tensor-execution", "npm run verify"],
    "owner": "tensor.resolved-plan/tensor.backend.simt/tensor.execution-result",
    "lifecycle": "Resolved plans own compiled module/function/prepared-DAG capabilities; each result owns only its run-created tensors/views/workspaces; sessions remain the aggregate terminal owner.",
    "design": {
      "owned_invariant": "One accepted mathematical TensorPlan resolves to one finite inspectable SIMT identity and every run either returns exact owned outputs or retains unproved rollback truth.",
      "public_ports": ["ResolvedTensorPlan", "resolveTensorPlan", "TensorExecutionResult"],
      "injected_dependencies": ["TensorSession", "TensorPlan or TensorProgram", "public CUDA-JS runtime from the session"],
      "adapter_boundaries": ["generated Device-JS compiler", "public CUDA-JS prepared operation DAG"],
      "simplest_sufficient_total_system": "One pure lowering owner, one CUDA-JS adapter, one resolved-plan lifecycle owner and no second scheduler or native boundary."
    }
  }
}
