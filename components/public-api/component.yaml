    "validation": ["npm run test:package", "npm run verify"],
    "owner": "tensor.public-api",
    "lifecycle": "Pure ESM export composition; owns no state or resource.",
    "design": {
      "owned_invariant": "Every installed-package symbol is exported through one reviewed facade while package-internal ports remain unexported.",
      "public_ports": ["cuda-js-tensor package root"],
      "injected_dependencies": [],
      "adapter_boundaries": ["installed ESM package"],
      "simplest_sufficient_total_system": "Two declarative re-export files and one manifest."
    }
  }
}
